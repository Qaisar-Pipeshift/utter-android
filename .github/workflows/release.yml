name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Forks never get the signing secrets.
    if: github.repository == 'Qaisar-Pipeshift/utter-android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gates
        run: |
          python3 -I scripts/check_public_hygiene.py
          python3 -I scripts/check_manifest.py
          python3 -I scripts/check_battery_rules.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.UTTER_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/utter-release.jks"
      - name: Test and build signed release
        env:
          UTTER_KEYSTORE_FILE: ${{ runner.temp }}/utter-release.jks
          UTTER_KEYSTORE_PASSWORD: ${{ secrets.UTTER_KEYSTORE_PASSWORD }}
          UTTER_KEY_ALIAS: ${{ secrets.UTTER_KEY_ALIAS }}
          UTTER_KEY_PASSWORD: ${{ secrets.UTTER_KEY_PASSWORD }}
        run: >
          gradle --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "utter-$V.apk"
          sha256sum "utter-$V.apk" > "utter-$V.apk.sha256"
          gh release create "v$V" "utter-$V.apk" "utter-$V.apk.sha256" \
            --title "Utter $V" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/utter-release.jks"
